# ==============================================================================
# RDNA2LLamacpp - Build & Update Configuration
# Edit this file to customize your build paths, GPU target, and deployment.
# ==============================================================================

[GPU]
# Target AMD GPU architecture:
# - gfx1030 : RX 6800, RX 6800 XT, RX 6900 XT, RX 6950 XT
# - gfx1031 : RX 6700, RX 6700 XT, RX 6750 XT
# - gfx1032 : RX 6600, RX 6600 XT, RX 6650 XT
# - gfx1034 : RX 6400, RX 6500 XT
# You can also target multiple: gfx1030;gfx1031;gfx1032;gfx1034
gpu_target = gfx1030

[Paths]
# Path to your ROCm / TheRock installation directory.
# (If left empty, the script auto-detects from $ROCM_PATH, $HIP_PATH, C:\opt\rocm, G:\opt\rocm, etc.)
rocm_path = G:\opt\rocm

# Path to the llama.cpp repository.
# (If left empty, checks sibling "../llama.cpp", "./llama.cpp", or automatically clones it)
llama_dir = G:\llama.cpp

# Optional: Directory where the compiled binaries, DLLs, and kernels will be deployed.
# Leave empty to keep built binaries self-contained in llama.cpp/build/bin.
deploy_path = G:\llama-b11734-windows-rocm-gfx103X-x64

[Build]
# Number of parallel compilation jobs (0 = auto-detect based on CPU threads, max 8)
jobs = 0

# Automatically run "git pull" on the llama.cpp repository before compiling
auto_pull = true

# Clean build directory before building (false = fast incremental rebuilds, true = fresh rebuild)
clean_build = false
